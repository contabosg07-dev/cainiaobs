name = "cainiao-api"
main = "src/index.js"
compatibility_date = "2026-10-12"

# D1 数据库绑定
# 首次执行 npm run db:create 后，把输出里的 database_id 替换到下面
[[d1_databases]]
binding = "DB"
database_name = "cainiao-db"
database_id = "REPLACE_AFTER_D1_CREATE"

[vars]
# 允许的前端来源，生产环境建议改成你的 Pages 域名，例如 https://cainiao.pages.dev
CORS_ORIGIN = "*"

# AUTH_SECRET 不要写在这里：
# 本地开发复制 .dev.vars.example 为 .dev.vars
# 生产使用：wrangler secret put AUTH_SECRET
