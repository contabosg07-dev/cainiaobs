name: Deploy to Cloudflare

# 推送到 main 即全自动部署：D1 建表 -> Worker 上线 -> 前端构建并发布 Pages
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# 同一时间只允许一个部署，后推的会取消先推的
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Deploy Worker & D1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Inject D1 database id
        run: |
          if [ -n "${D1_DATABASE_ID:-}" ]; then
            sed -i "s/REPLACE_AFTER_D1_CREATE/${D1_DATABASE_ID}/g" wrangler.toml
          fi
          if grep -q "REPLACE_AFTER_D1_CREATE" wrangler.toml; then
            echo "::error::wrangler.toml 中仍是占位 database_id。请先 wrangler d1 create cainiao-db，并把真实 id 回填 wrangler.toml 或配置 GitHub Variable D1_DATABASE_ID"
            exit 1
          fi
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 schema (idempotent)
        run: npx wrangler d1 execute cainiao-db --remote --file schema.sql

      - name: Upload AUTH_SECRET
        run: echo "${AUTH_SECRET}" | npx wrangler secret put AUTH_SECRET
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Smoke test (admin endpoint must require auth)
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://cainiao-api.${CF_SUBDOMAIN}.workers.dev/api/admin/users || true)
          echo "unauthenticated /api/admin/users -> $code"
          test "$code" = "401"
        env:
          CF_SUBDOMAIN: ${{ vars.CF_SUBDOMAIN }}

  deploy-pages:
    name: Build & Deploy Pages
    needs: deploy-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure Pages project exists
        run: npx wrangler pages project create cainiao-frontend --production-branch=main || true

      - name: Build
        run: npm run build
        env:
          # 构建期注入 Worker 地址，例如 https://cainiao-api.xxx.workers.dev
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Deploy to Pages
        run: npx wrangler pages deploy dist --project-name=cainiao-frontend --branch=main --commit-dirty=true
