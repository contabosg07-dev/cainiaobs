name: 重置管理员密码

# 手动触发：Actions -> 重置管理员密码 -> Run workflow，输入新密码
# 只重写 admin 账号的密码哈希，不影响其它数据
on:
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'admin 的新密码（至少 6 位，不要包含双引号）'
        required: true
        type: string

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  reset-admin-password:
    name: Seed admin password to remote D1
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ inputs.admin_password }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Inject D1 database id
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -z "${D1_DATABASE_ID}" ]; then
            echo "::error::未读到 Variable D1_DATABASE_ID。请确认它建在 Variables 标签（不是 Secrets）"
            exit 1
          fi
          sed -i "s/REPLACE_AFTER_D1_CREATE/${D1_DATABASE_ID}/g" wrangler.toml

      - name: Validate password input
        run: |
          if [ "${#ADMIN_PASSWORD}" -lt 6 ]; then
            echo "::error::密码至少 6 位"
            exit 1
          fi
          case "${ADMIN_PASSWORD}" in
            *'"'*) echo "::error::密码不能包含双引号"; exit 1 ;;
          esac

      - name: Reset admin password in remote D1
        run: node seed.mjs remote

      - name: Verify login with new password
        run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST https://api.resbti.dpdns.org/api/login \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"admin\",\"password\":\"${ADMIN_PASSWORD}\"}" || true)
            echo "attempt $i: login -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::新密码登录验证失败"
          exit 1
